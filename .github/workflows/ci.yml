name: CI

# Runs on every PR and every push to main. The release workflow
# (release.yml) re-runs the same gates at tag time; this one catches
# breakage before it is merged.
#
#   test      — SQLite suite across every supported Python (3.11+).
#   postgres  — the opt-in `--postgres` suite. ubuntu-latest ships
#               Docker, which testcontainers uses to start postgres:16.
#   lint      — ruff + mypy strict on the floor version, so a 3.12+
#               construct sneaking into src/ fails here first.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      # Pinned to the exact release — setup-uv v8 has no moving @v8 tag.
      - uses: astral-sh/setup-uv@v8.1.0

      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Sync dependencies
        run: uv sync --python ${{ matrix.python }} --all-extras

      - name: Run test suite
        run: uv run --python ${{ matrix.python }} pytest --tb=short

  postgres:
    name: Test (Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.1.0

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --python 3.13 --all-extras

      - name: Run Postgres suite
        run: uv run --python 3.13 pytest --postgres --tb=short

  lint:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.1.0

      - name: Install Python 3.11
        run: uv python install 3.11

      # --all-extras so mypy sees litellm / shekel / asyncpg / tiktoken,
      # matching the release workflow (see fbc7046).
      - name: Sync dependencies
        run: uv sync --python 3.11 --all-extras

      - name: Ruff
        run: uv run --python 3.11 ruff check src/ tests/ benchmarks/

      - name: Mypy
        run: uv run --python 3.11 mypy src/snipz benchmarks/
